# Lokalni mosquitto broker, na ktery se pripojuji klienti a agent.
# Spoustet:  mosquitto -c mosquitto/mosquitto.conf -v

# 1883 muze obsadit mosquitto sluzba z instalatoru, proto 1884
listener 1884

# bez loginu se nikdo nepripoji
allow_anonymous false

# uzivatele a hesla - vytvari se prikazem mosquitto_passwd
password_file mosquitto/passwd

# kdo muze cist/zapisovat jake topicy
acl_file mosquitto/acl
